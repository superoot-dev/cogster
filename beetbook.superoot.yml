        name: Stick pack film (STK)
        # Sidrane Quote 24123 (2025-09-30), Silver Cosmetic Web + 1 Mil Matte OPP, 80mm × 140mm.
        # 48K actual billed = $0.069 (Inv 165254) — sits between 30K/50K quote tiers.
        cost:
          tiers:
            - { min_run_units: 20000, value: 0.073 }
            - { min_run_units: 30000, value: 0.067 }
            - { min_run_units: 50000, value: 0.063 }
            - { min_run_units: 75000, value: 0.061 }
            - { min_run_units: 100000, value: 0.059 }
        units_per_quote: 1

      - id: caddy
        name: Caddy / display box (DB)
        # Sidrane bundles SKUs on caddy print runs (different art, same stock/die).
        # Tier lookup is per-SKU sticks but rates assume typical 2-SKU bundled PO.
        # PR2 actuals (Inv 165255, 2026-04-08): 3K caddies × 2 SKUs = 6K bundle
        # billed at $1,100/M = $1.10/caddy. Original per-SKU Oct 2025 ladder
        # (40K=$1.86, 80K=$1.10, 160K=$0.6719) DOES NOT reflect actual billing.
        # Tiers below reflect 2-SKU bundle: per-SKU sticks × 2 hits next tier.
        cost:
          tiers:
            - { min_run_units: 48000, value: 1.1000 }
            - { min_run_units: 80000, value: 0.7940 }
            - { min_run_units: 160000, value: 0.5400 }
            - { min_run_units: 320000, value: 0.3880 }
        units_per_quote: 16
        pack_size: 16

      # Tooling/prep line omitted — small enough to ignore for steady-state.
      # Reality: $900 tool + $200 prep billed once on PR1 caddy (Inv 164568,
      # 2026-03-04) for first run of new die AC300557. Subsequent runs reusing
      # same die (Inv 165255, 2026-04-08) carry no tool/prep charges.
      # First-run amortized over 6K-caddy bundle ≈ $0.18/caddy (~1.3pp GM hit
      # one time only). May reapply when launching new SKU/size requiring new
      # die — unsure of future cadence.

      - id: inner_case
        name: Shipping case (IC)
        cost: 0.5
        units_per_quote: 96
        pack_size: 96

      - id: outer_master_case
        name: Outer master case (OMC)
        cost: 1
        units_per_quote: 768
        pack_size: 768

      - id: pallet_prep
        name: Pallet wrap + labels
        cost: 0.05
        units_per_quote: 16

      - id: pkg_inbound_freight
        name: Inbound freight (packaging vendor → coman)
        cost: 0.2
        units_per_quote: 16

  - id: pouch_pkg
    name: Stand-up pouch + spoon + case (printed pouch supplied to Bactolac)
    components:
      - id: pouch_film
        name: Stand-up pouch (EPac printed)
        # EPac quote ~$0.67/pouch per data/docs/pouch_cost_structure.md.
        # Single tier until EPac volume quote sourced.
        cost: 0.67
        units_per_quote: 1
      - id: pouch_inner_case
        name: Shipping case (8x8x8, 10 pouches per)
        cost: 0.65
        units_per_quote: 10
        pack_size: 10
      - id: pouch_outer_master_case
        name: Outer master case (18x18x18, 8 inner cases per = 80 pouches)
        cost: 1.20
        units_per_quote: 80
        pack_size: 80
      - id: pouch_pallet_prep
        name: Pallet wrap + labels
        cost: 0.05
        units_per_quote: 10
      - id: pouch_inbound_freight
        name: Inbound freight (EPac pouches -> Bactolac)
        # ~$0.50/pouch estimate per data/docs/pouch_cost_structure.md.
        cost: 0.50
        units_per_quote: 1

  - id: merchantboxes_quote_reference
    name: MerchantBoxes caddy + display-tier quote (reference, not wired)
    components:
      - id: caddy_or_tier
        name: Caddy or display tier (combined quote, FOB China)
        cost:
          tiers:
            - { min_run_units: 5000, value: 0.55 }
            - { min_run_units: 10000, value: 0.40 }
            - { min_run_units: 25000, value: 0.37 }
            - { min_run_units: 50000, value: 0.35 }
            - { min_run_units: 100000, value: 0.31 }
        units_per_quote: 1

logistics:
  # D2C parcel (FP T1 rates as of Feb 2026)
  dtc_pick_fee: 2.30 # first pick-unit (caddy or stick)
  dtc_pick_addl_unit: 1.02 # each additional pick-unit
  dtc_third_party_label_fee: 0 # FP carrier acct; set to 2.00 if 3rd party
  dtc_units_per_order: 0 # 0 = auto-derive from bundle.pick_units

  # B2B fees (FP T1)
  # Pallet mode (whole_foods, sprouts) fires: per_store + per_pallet + pallet_wrap + outlabel
  # Case mode  (indie_retail Faire)    fires: per_store + per_carton + per_label + outlabel
  # Per-unit / per-carton / per-label / pallet_wrap / per_pallet auto-gated by channel mode.
  b2b_order_prep_fee: 0
  b2b_per_store_per_order: 2.95
  b2b_per_unit: 0 # Bactolac pre-packs cartons; FP never picks loose units
  b2b_per_carton: 6.25 # case-mode only (Faire). Pallet mode ignores.
  b2b_per_label: 0 # Bactolac applies SKU labels at production
  b2b_per_pallet: 11.25 # pallet-mode handling ("ship as is" pallet)
  b2b_pallet_wrap: 18.50 # FP wraps freshly built outbound pallet
  b2b_third_party_label_fee: 0 # UNFI pickup (WFM/Sprouts) + Faire prepaid labels

  # Receiving / storage (FP T1)
  pallet_in_fee: 11.25
  receiving_per_unit: 0 # Bactolac ships pallets, not loose cases
  receiving_per_carton: 0
  pallet_storage_monthly: 22.50
  bin_storage_monthly: 0

  # Returns
  returns_first_unit: 2.15
  returns_addl_unit: 0.95
  default_returns_rate: 0 # set per sales line via returns_rate

  avg_b2b_order_cases: 60 # WFM/Sprouts default; Faire lines override to ~3
  dtc_avg_order_value: 45
  inbound_truckload_cost: 1200
  pallets_per_truckload: 26
  outbound_freight:
    dry:
      - { pallets_per_order: 1, cost_per_pallet: 314.11 }
      - { pallets_per_order: 3, cost_per_pallet: 125.00 }
      - { pallets_per_order: 6, cost_per_pallet: 102.85 }
      - { pallets_per_order: 12, cost_per_pallet: 56.62 }
    refer:
      - { pallets_per_order: 1, cost_per_pallet: 439.75 }
      - { pallets_per_order: 3, cost_per_pallet: 175.00 }
      - { pallets_per_order: 6, cost_per_pallet: 143.99 }
      - { pallets_per_order: 12, cost_per_pallet: 79.27 }
    frozen:
      - { pallets_per_order: 1, cost_per_pallet: 1550.00 }
      - { pallets_per_order: 3, cost_per_pallet: 245.00 }
      - { pallets_per_order: 6, cost_per_pallet: 201.58 }
      - { pallets_per_order: 12, cost_per_pallet: 110.97 }

