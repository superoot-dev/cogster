# Run `npm run beetbook:cli` to see reports via CLI.
# Run `npm run beetbook` to start the web server and UI.
# See ~/Code/beetbook to understand (or modify) the BeetBook engine source code.

plan:
  id: superoot
  name: Superoot
  currency: USD
  # Using the @cashflow.xlsx model for the "prelude" to this model.
  # Thus the starting point here shown is after we get an expected +$100K investment,
  # after we pay all outstanding -$45K legal fees from recap, after we pay -$45K to Bactolac to release
  # PO2 and initiate PO3, and after we receive about +$30K from invoice to UNFI for PO1.
  start_month: 2026-07
  months: 32
  opening_cash: 90000

products:
  - id: my16
    name: Ginger Mango Yuzu Caddy
    unit: stick_pack
    unit_basis:
      - { id: stick, label: Stick, multiplier: 1 }
      - { id: caddy, label: Caddy, multiplier: 16 }
    units_per_case: 96
    cogs:
      processing: coman_my16
      packaging: stick_pack_pkg
    inventory:
      beginning_finished_goods_units: 48000
      beginning_finished_goods_unit_cost: 0
      target_months_on_hand: 1
    logistics:
      cases_per_pallet: 80
      temp_class: dry
      weight_per_case_lbs: 18
    bundles:
      # Shopify DTC bundles. Caddy = 16 sticks. Subscription bundles keep the
      # original bundle price here and apply Subscribe & Save separately:
      # 10% / 12% / 15% off for 1/2/3 caddies. Free shipping at $75+
      # (3-caddy bundles qualify).
      - {
          id: trial_3,
          name: Trial (3 sticks),
          units: 3,
          pick_units: 3,
          price: 9.99,
          shipping_cost: 4.08,
          shipping_rev: 0,
        }
      - {
          id: caddy_1_ot,
          name: 1 Caddy (one-time),
          units: 16,
          pick_units: 1,
          price: 35.00,
          shipping_cost: 6.17,
          shipping_rev: 6.17,
        }
      - {
