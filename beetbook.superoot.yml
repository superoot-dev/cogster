trade_plans:
  - id: whole_foods_y1_my16
    name: "Whole Foods Year 1"
    product: my16
    channel: whole_foods
    start_month: 2026-07
    end_month: 2032-07
    # 2 OI/yr x 15% x 1mo/12 = 2.5%
    off_invoice_pct: 0.025
    # 4 MCB/yr x 20% x ~2 actual wks each / 52 ≈ 3.1%; use 3.33% (1mo nominal / 12 x 4 x 20% halved for 2-wk reality)
    mcb_pct: 0.0333
    mcb_on_top_of_oi: true
    # No scan dollars or EDLC for WFM per John 2026-05-21
    scan_pct: 0
    spoilage_pct: 0.01
    # 5% retail overlay on OI weeks + general buffer bucket
    coop_mdf_pct: 0.05
    edlc_pct: 0
    free_fill:
      # Lifetime free fill = 1 caddy/SKU/store × end-of-ramp WFM doors.
      # Engine spreads emission across months as new doors open (per_new_location).
      # Cogs only - no markup; free fill is literally giving units away.
      units: { expr: "wfm_doors_end * wfm_caddy_units" }
      value_basis: cogs
      per_new_location: true

